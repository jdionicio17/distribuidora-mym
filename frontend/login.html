<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Distribuidora MyM</title>

    <!-- CSS principal (el mismo del sitio público) -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />
</head>
<body class="site-body auth-page">

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-icon">MyM</span>
            <div class="auth-logo-text">
                <h1>Distribuidora MyM</h1>
                <p>Acceso al panel administrativo</p>
            </div>
        </div>

        <div class="auth-header">
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus credenciales para acceder al sistema.</p>
        </div>

        <!-- IMPORTANTE: quitamos action="..." y le ponemos id -->
        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario"
                       placeholder="Ej. jmendez" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                       placeholder="Ingresa tu contraseña" required>
            </div>

            <div class="auth-extra-row">
                <label class="remember-row">
                    <input type="checkbox" name="recordar" id="recordar">
                    <span>Recordarme en este equipo</span>
                </label>

                <a href="#" class="auth-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-primary btn-full auth-btn">
                <i class="fa-solid fa-right-to-bracket"></i>&nbsp;
                Iniciar sesión
            </button>
        </form>

        <div class="auth-footer">
            <p class="auth-note">
                Acceso exclusivo para personal autorizado de Distribuidora MyM.
            </p>
            <p class="auth-back">
                <a href="index.html">← Volver al sitio principal</a>
            </p>
        </div>
    </div>
</div>

<script>
  const loginForm = document.getElementById('loginForm');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const usuario  = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;

    if (!usuario || !password) {
      alert('Por favor ingresa usuario y contraseña.');
      return;
    }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ usuario, password })
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        alert(data.message || 'Error al iniciar sesión');
        return;
      }

      const usuarioLog = data.usuario || {};
      const rol = usuarioLog.rol;

      // Opcional: guardar usuario simple en localStorage
      localStorage.setItem('usuarioMyM', JSON.stringify({
        id_usuario: usuarioLog.id_usuario,
        usuario: usuarioLog.usuario,
        nombre_completo: usuarioLog.nombre_completo,
        rol: usuarioLog.rol
      }));

      // Redirecciones por rol
      if (rol === 'admin') {
        window.location.href = 'adminv.html';
      } else if (rol === 'ventas') {
        window.location.href = 'vendedorv.html';
      } else if (rol === 'bodega') {
        window.location.href = 'bodegav.html';
      } else if (rol === 'cobros') {
        window.location.href = 'cobrosv.html';
      } else {
        alert('Rol no reconocido: ' + rol);
      }

    } catch (err) {
      console.error(err);
      alert('Error al iniciar sesión');
    }
  });
</script>

</body>
</html>
